<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Météo Pro</title>
    <link rel="stylesheet" href="meteo.css" />
  </head>

  <body class="light">
    <!-- Toggle Thème -->
    <button id="theme-toggle" class="theme-btn">🌙</button>

    <div class="app">
      <h1 class="app-title">🌤️ Application Météo Professionnelle</h1>

      <!-- Barre de recherche -->
      <div class="search-container">
        <input
          type="text"
          id="searchInput"
          placeholder="Rechercher une ville..."
        />
        <button id="searchBtn">🔍</button>
        <button id="geoBtn">📍</button>
      </div>

      <!-- Autocomplétion -->
      <ul id="suggestions"></ul>

      <!-- Carte météo principale -->
      <div class="weather-card fade-in">
        <h2 id="cityName">—</h2>
        <p id="localTime" class="local-time">Heure locale : —</p>

        <div class="weather-info">
          <img id="weatherIcon" src="" alt="" />
          <p id="temperature" class="big-temp">—°C</p>
        </div>

        <div class="details">
          <p class="detail-text">
            <strong>Humidité :</strong> <span id="humidity">—%</span>
          </p>
          <p class="detail-text">
            <strong>Vent :</strong> <span id="wind">— km/h</span>
          </p>
        </div>
      </div>

      <!-- CONTENEUR 2 COLONNES -->
      <div class="two-columns">
        <!-- Prévisions -->
        <div class="forecast-section">
          <h3 class="subtitle forecast-title">Prévisions sur 5 jours</h3>
          <div id="forecast" class="forecast-container fade-in"></div>
        </div>

        <!-- Villes enregistrées -->
        <div class="saved-section">
          <h3 class="subtitle saved-title">Villes enregistrées</h3>
          <div id="savedCities" class="saved-cities"></div>
        </div>
      </div>
    </div>
  </body>
</html>
