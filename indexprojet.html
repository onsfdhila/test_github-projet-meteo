<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>App Météo Pro</title>
    <link rel="stylesheet" href="meteo.css" />
  </head>
  <body class="light">
    <button id="theme-toggle" class="theme-btn" aria-label="Basculer thème">
      🌙
    </button>

    <div class="app">
      <h1 class="app-title">🌤 Météo Live</h1>

      <div class="search-section">
        <div class="search-container">
          <input
            id="searchInput"
            type="text"
            placeholder="Rechercher une ville..."
            autocomplete="off"
            aria-autocomplete="list"
            aria-controls="suggestions"
            aria-expanded="false"
          />
          <button id="searchBtn" class="search-button" aria-label="Rechercher">
            🔍
          </button>
          <button
            id="geoBtn"
            class="geo-button"
            title="Ma position"
            aria-label="Ma position"
          >
            📍
          </button>
        </div>
        <ul
          id="suggestions"
          class="suggestions-list"
          role="listbox"
          tabindex="-1"
          aria-label="Suggestions"
        ></ul>
      </div>

      <div class="weather-card fade-in" role="region" aria-live="polite">
        <div class="weather-header">
          <h2 id="cityName">—</h2>
          <p id="localTime" class="local-time">Heure locale : —</p>
        </div>

        <div class="weather-main">
          <div class="weather-icon-container">
            <img id="weatherIcon" src="" alt="" class="weather-icon" />
          </div>
          <p id="temperature" class="big-temp">—°C</p>
        </div>

        <div class="weather-details">
          <div class="sun-times">
            <p id="currentDate" class="detail-item">📅 Date : —</p>
            <p id="sunrise" class="detail-item">🌅 Lever : —</p>
            <p id="sunset" class="detail-item">🌇 Coucher : —</p>
          </div>
          <div class="detail-item">
            <span class="detail-label">💨 Vent</span>
            <span id="wind" class="detail-value">— km/h</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">🌡 Ressenti</span>
            <span id="feelsLike" class="detail-value">—°C</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">💧 Humidité</span>
            <span id="humidity" class="detail-value">—%</span>
          </div>
        </div>
      </div>

      <div class="two-columns">
        <div class="forecast-section">
          <h3 class="subtitle forecast-title">📅 Prévisions 5 jours</h3>
          <div id="forecast" class="forecast-container fade-in"></div>
        </div>

        <div class="saved-section">
          <h3 class="subtitle saved-title">⭐ Villes favorites</h3>
          <div id="savedCities" class="saved-cities"></div>
        </div>
      </div>
    </div>

    <script src="scriptmeteoapi.js"></script>
  </body>
</html>
